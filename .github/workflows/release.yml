name: Release builds
on:
  # Called by release-please.yml once its release PR is merged; a tag pushed
  # by hand still builds too.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # The Developer ID Application certificate (a base64 .p12) goes into a
      # throwaway keychain, where build.sh finds it. Without the secret the
      # build is signed ad-hoc, as before.
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then echo "No MACOS_CERTIFICATE_P12 secret: the app will be signed ad-hoc"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
      - run: ./scripts/build.sh
      - run: ./target/release/agents-pixel-dungeon --self-test
      # Notarize with an App Store Connect API key and staple the ticket, so
      # Gatekeeper opens the app without "Apple could not verify…". Skipped
      # without the secrets.
      - name: Notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/notarize.sh "build/Agents Pixel Dungeon.app"
      - run: cd build && ditto -c -k --keepParent "Agents Pixel Dungeon.app" "Agents-Pixel-Dungeon-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Agents-Pixel-Dungeon-macOS
          path: build/Agents-Pixel-Dungeon-macOS.zip
      - if: inputs.tag || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/Agents-Pixel-Dungeon-macOS.zip
  # The Homebrew tap (JoseValencia125/homebrew-tap) gets this release's
  # version and checksum, pushed with a deploy key (TAP_DEPLOY_KEY) that
  # has write access to that repository only.
  homebrew-tap:
    needs: macos
    if: inputs.tag || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JoseValencia125/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: Agents-Pixel-Dungeon-macOS
      - name: Bump the cask to this release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          SHA="$(sha256sum Agents-Pixel-Dungeon-macOS.zip | cut -d' ' -f1)"
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/agents-pixel-dungeon.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "agents-pixel-dungeon $VERSION"
          git push
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev
      - run: ./scripts/build.sh
      - run: ./target/release/agents-pixel-dungeon --self-test
      - run: cd build && tar -czf agents-pixel-dungeon-linux-x86_64.tar.gz agents-pixel-dungeon agents-pixel-dungeon.png agents-pixel-dungeon.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: agents-pixel-dungeon-linux-x86_64
          path: build/agents-pixel-dungeon-linux-x86_64.tar.gz
      - if: inputs.tag || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/agents-pixel-dungeon-linux-x86_64.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build.ps1
      - run: ./target/release/agents-pixel-dungeon --self-test
        shell: bash
      - run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build dist\agents-pixel-dungeon -Recurse
          Compress-Archive -Path dist\agents-pixel-dungeon -DestinationPath dist\agents-pixel-dungeon-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agents-pixel-dungeon-windows-x86_64
          path: dist/agents-pixel-dungeon-windows-x86_64.zip
      - if: inputs.tag || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/agents-pixel-dungeon-windows-x86_64.zip
