[package]
name = "agents-pixel-dungeon"
version = "2.4.0"
edition = "2021"
description = "A native pixel-art guild for your live Herdr agents, for macOS and Linux."
license = "MIT"
authors = ["Diabolo Studio (https://diabolostudio.com/)"]
default-run = "agents-pixel-dungeon"

[[bin]]
name = "agents-pixel-dungeon"
path = "src/main.rs"

# Guild: the work layer (quests, tasks, attempts, workspaces, harness
# adapters) as a library both binaries use, and the service that runs it.
[lib]
name = "guild"
path = "src/guild/lib.rs"

[[bin]]
name = "agents-pixel-dungeon-guild"
path = "src/bin/guild.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
sha2 = "0.10"
ulid = "1"
toml_edit = "=0.20.2"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.31"
egui_term = "=0.1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
notify-rust = "4"
rodio = { version = "0.20", default-features = false }
rfd = "0.15"
auto-launch = "0.5"
sys-locale = "0.3"
dirs = "6"
chrono = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.2", features = ["NSArray"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
